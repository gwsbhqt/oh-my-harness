[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-use"
version = "0.3.0"
description = "Control the running Antigravity App via its official Sidecar bridge"
requires-python = ">=3.11"

[project.scripts]
agy-use = "agy_use.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
