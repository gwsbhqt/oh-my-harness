[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-use"
version = "0.1.1"
description = "Run the official Antigravity CLI from a Python skill or command line"
requires-python = ">=3.11"

[project.scripts]
agy-use = "agy_use.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
