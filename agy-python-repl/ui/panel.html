<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python REPL Workbench</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: var(--color-background-primary, var(--vscode-editor-background, Canvas));
      --surface: var(--color-background-secondary, var(--vscode-sideBar-background, Canvas));
      --text: var(--color-text-primary, var(--vscode-editor-foreground, CanvasText));
      --muted: var(--color-text-secondary, var(--vscode-descriptionForeground, GrayText));
      --border: var(--color-border-primary, var(--vscode-panel-border, color-mix(in srgb, CanvasText 22%, transparent)));
      --accent: var(--color-ring-primary, var(--vscode-focusBorder, Highlight));
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 14px; background: var(--background); color: var(--text);
      font: 13px/1.5 var(--font-sans, system-ui, sans-serif); overflow-wrap: anywhere; }
    header, .row, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
    header, .row { justify-content: space-between; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 16px; } h2 { font-size: 14px; } h3 { font-size: inherit; }
    section { margin-top: 18px; }
    article { margin-top: 6px; padding: 9px 10px; border: 1px solid var(--border);
      border-radius: var(--border-radius-md, 6px); background: var(--surface); }
    code, .names { font-family: var(--font-mono, ui-monospace, monospace); white-space: pre-wrap; }
    code { display: block; margin-top: 4px; }
    button, select { padding: 3px 8px; font: inherit; background: var(--background); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--border-radius-sm, 4px); }
    button:enabled { cursor: pointer; } button:disabled { opacity: .6; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .muted, label { font-size: 12px; color: var(--muted); }
    .actions, .notice, .names { margin-top: 6px; }
    .error { color: var(--color-text-danger, var(--vscode-errorForeground, light-dark(#a42121, #ffaaaa))); }
  </style>
</head>
<body>
  <header>
    <h1>Python REPL Workbench</h1>
    <div class="actions"><button id="attach" hidden>Attach kernel summary to chat</button><button id="refresh" disabled>Refresh</button></div>
  </header>
  <p id="status" role="status" class="notice muted">Connecting to host…</p>
  <p id="error" role="alert" class="notice error" hidden></p>
  <section aria-labelledby="kernels-title">
    <h2 id="kernels-title">Active kernels</h2><div id="kernels"></div>
  </section>
  <section aria-labelledby="history-title">
    <div class="row"><h2 id="history-title">Recent cells</h2>
      <label id="filter-label" hidden>Kernel <select id="filter"></select></label></div>
    <div id="history"></div>
  </section>
  <script id="mcp-bridge">
    function panelHost(view, onNotification) {
      const parent = view.parent;
      const version = "2026-01-26";
      const pending = new Map();
      let nextId = 1;
      let origin;
      let ready = false;
      let capabilities = {};

      function post(message) {
        parent.postMessage({ jsonrpc: "2.0", ...message }, origin && origin !== "null" ? origin : "*");
      }
      function request(method, params, timeout = 60000) {
        const id = nextId++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(`Host timed out on ${method}.`));
          }, timeout);
          pending.set(id, { resolve, reject, timer });
          try { post({ id, method, params }); }
          catch (error) { clearTimeout(timer); pending.delete(id); reject(error); }
        });
      }
      view.addEventListener("message", (event) => {
        const msg = event.data;
        if (event.source !== parent || (origin !== undefined && event.origin !== origin) || msg?.jsonrpc !== "2.0") return;
        if (typeof msg.method === "string") {
          if (!ready) return;
          if (msg.id === undefined) onNotification(msg.method, msg.params);
          else if (msg.method === "ping" || msg.method === "ui/resource-teardown") post({ id: msg.id, result: {} });
          else post({ id: msg.id, error: { code: -32601, message: "Method not found" } });
          return;
        }
        const entry = pending.get(msg.id);
        if (!entry || (Object.hasOwn(msg, "result") === Object.hasOwn(msg, "error"))) return;
        origin = event.origin;
        clearTimeout(entry.timer);
        pending.delete(msg.id);
        if (msg.error) entry.reject(new Error(msg.error.message || "Host request failed."));
        else entry.resolve(msg.result);
      });
      function supports(name, format) {
        const value = format ? capabilities[name]?.[format] : capabilities[name];
        return value !== null && typeof value === "object" && !Array.isArray(value);
      }
      return {
        supports,
        async initialize() {
          if (!parent || parent === view) throw new Error("Open this panel inside an MCP Apps host.");
          const result = await request("ui/initialize", {
            protocolVersion: version, appCapabilities: {}, appInfo: { name: "agy-python-repl-panel", version: "0.2.0" }
          }, 15000);
          if (result?.protocolVersion !== version) throw new Error("The host does not support the panel’s MCP Apps protocol version.");
          capabilities = result.hostCapabilities || {};
          ready = true;
          post({ method: "ui/notifications/initialized", params: {} });
          return result.hostContext || {};
        },
        tool(name, args = {}) {
          if (!supports("serverTools")) throw new Error("This host does not provide kernel controls.");
          return request("tools/call", { name, arguments: args });
        },
        sendText(capability, method, text) {
          if (!supports(capability, "text")) throw new Error("This host does not accept text for this action.");
          const params = { content: [{ type: "text", text }] };
          if (method === "ui/message") params.role = "user";
          return request(method, params);
        },
        resize(height) { if (ready) post({ method: "ui/notifications/size-changed", params: { height } }); }
      };
    }
  </script>
  <script>
    const byId = (id) => document.getElementById(id);
    const refreshButton = byId("refresh");
    const attachButton = byId("attach");
    const filter = byId("filter");
    const host = panelHost(window, receive);
    const busy = new Set();
    let overview = null;
    let revision = 0;

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    function button(label, action) {
      const node = element("button", label);
      node.addEventListener("click", () => handle(action));
      return node;
    }
    function showError(error) {
      byId("error").textContent = error.message || String(error);
      byId("error").hidden = false;
    }
    async function handle(action) {
      byId("error").hidden = true;
      try { await action(); } catch (error) { showError(error); }
    }
    function unpack(result) {
      const text = result?.content?.find((part) => part.type === "text")?.text;
      if (result?.isError) throw new Error(text || "Kernel tool failed.");
      const payload = result?.structuredContent ?? (text ? JSON.parse(text) : null);
      if (!payload) throw new Error("The kernel tool returned no data.");
      if (payload.status === "error") throw new Error(payload.error || payload.reason || "Kernel action failed.");
      return payload;
    }
    function theme(context) {
      const style = document.documentElement.style;
      if (context.theme === "dark" || context.theme === "light") style.colorScheme = context.theme;
      for (const [key, value] of Object.entries(context.styles?.variables || {})) {
        if (/^--(?:color-|font-|border-radius-)/.test(key) && typeof value === "string") style.setProperty(key, value);
      }
    }
    function receive(method, params) {
      if (method === "ui/notifications/host-context-changed") theme(params || {});
      if (method === "ui/notifications/tool-result") handle(() => renderOverview(unpack(params)));
      if (method === "ui/notifications/tool-cancelled") byId("status").textContent = params?.reason || "Tool call cancelled.";
    }
    function kernelCard(kernel) {
      const card = element("article");
      const heading = element("div", undefined, "row");
      heading.append(element("h3", kernel.name), element("span", `${kernel.alive ? "Alive" : "Stopped"} · Python ${kernel.python || "?"}`, "muted"));
      card.append(heading, element("p", `Skills: ${kernel.skills_loaded.join(", ") || "none"}`, "muted"));
      if (!host.supports("serverTools")) return card;
      const actions = element("div", undefined, "actions");
      const detail = element("div", undefined, "names");
      detail.setAttribute("aria-live", "polite");
      async function run(action) {
        if (busy.has(kernel.name)) return;
        busy.add(kernel.name);
        for (const item of actions.children) item.disabled = true;
        try {
          const result = unpack(await host.tool("app_kernel_action", { action, kernel: kernel.name }));
          if (action === "vars") { detail.textContent = `Variables: ${result.names.join(", ") || "(empty)"}`; return; }
          let message;
          if (action === "snapshot") message = `Snapshot · ${result.saved.length} saved · ${result.skipped.length} skipped`;
          if (action === "restore") message = `${result.status === "partial" ? "Partial restore" : "Restore"} · ${result.restored.length} restored · ${result.failed.length} failed`;
          if (action === "reset") message = `Reset ${kernel.name}.`;
          await refresh();
          byId("status").textContent = message;
        } finally {
          busy.delete(kernel.name);
          for (const item of actions.children) item.disabled = false;
        }
      }
      function confirm(action) {
        const prompt = action === "reset" ? "Delete this kernel and its saved snapshot?" : "Restore saved variables into this kernel?";
        const choices = element("div", undefined, "actions");
        choices.append(button("Cancel", () => { detail.replaceChildren(); actions.querySelector(`[data-action=${action}]`).focus(); }),
          button(`Confirm ${action}`, () => { detail.replaceChildren(); return run(action); }));
        detail.replaceChildren(element("span", prompt), choices);
        choices.firstChild.focus();
      }
      for (const [name, label] of [["vars", "Variables"], ["snapshot", "Snapshot"], ["restore", "Restore"], ["reset", "Reset"]]) {
        const control = button(label, () => {
          if (name === "restore" || name === "reset") return confirm(name);
          detail.replaceChildren();
          return run(name);
        });
        control.dataset.action = name;
        actions.append(control);
      }
      card.append(actions, detail);
      return card;
    }
    function renderHistory() {
      const rows = overview.history.filter((cell) => !filter.value || cell.kernel === filter.value);
      byId("history").replaceChildren(...rows.map((cell) => {
        const card = element("article");
        const heading = element("div", undefined, "row");
        heading.append(element("strong", cell.kernel), element("span", `${cell.status} · ${cell.duration_ms} ms${cell.truncated ? " · output truncated" : ""}`, "muted"));
        card.append(heading, element("code", cell.code_preview || "(empty)"));
        if (host.supports("message", "text")) card.append(button("Ask about this cell", () => host.sendText("message", "ui/message",
          `Explain this ${cell.status} Python cell on ${cell.kernel}: ${cell.code_preview}`)));
        return card;
      }));
      if (!rows.length) byId("history").append(element("p", "No cells executed yet.", "muted"));
    }
    function renderOverview(data) {
      if (!Array.isArray(data.kernels) || !Array.isArray(data.history)) throw new Error("The tool did not return a kernel overview.");
      revision++;
      overview = data;
      byId("kernels").replaceChildren(...data.kernels.map(kernelCard));
      if (!data.kernels.length) byId("kernels").append(element("p", "No active kernels yet.", "muted"));
      const names = [...new Set(data.history.map((cell) => cell.kernel))];
      const selected = filter.value;
      filter.replaceChildren(new Option("All kernels", ""), ...names.map((name) => new Option(name, name)));
      if (names.includes(selected)) filter.value = selected;
      byId("filter-label").hidden = names.length < 2;
      attachButton.hidden = !host.supports("updateModelContext", "text");
      byId("status").textContent = host.supports("serverTools") ? "" : "The host provides this overview in read-only mode.";
      renderHistory();
    }
    async function refresh() {
      const before = ++revision;
      const data = unpack(await host.tool("app_kernel_overview"));
      if (before === revision) renderOverview(data);
    }
    filter.addEventListener("change", renderHistory);
    refreshButton.addEventListener("click", () => handle(refresh));
    attachButton.addEventListener("click", () => handle(async () => {
      const summary = overview.kernels.map((kernel) => `${kernel.name} (${kernel.alive ? "alive" : "stopped"}, Python ${kernel.python || "?"})`).join(", ");
      await host.sendText("updateModelContext", "ui/update-model-context", `Active Python kernels: ${summary || "none"}.`);
      byId("status").textContent = "Kernel summary attached to chat.";
    }));
    handle(async () => {
      theme(await host.initialize());
      refreshButton.disabled = !host.supports("serverTools");
      byId("status").textContent = "Waiting for the kernel overview…";
      if (typeof ResizeObserver === "function") new ResizeObserver(() => host.resize(Math.ceil(document.body.getBoundingClientRect().height))).observe(document.body);
      if (host.supports("serverTools") && !overview) await refresh();
    }).then(() => { if (!byId("error").hidden && !overview) byId("status").textContent = ""; });
  </script>
</body>
</html>
