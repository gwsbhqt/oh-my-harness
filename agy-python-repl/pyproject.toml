[project]
name = "agy-python-repl"
version = "0.2.7"
description = "Persistent Prime Python REPL workbench plugin for Antigravity."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "dill>=0.3.8",
]

[project.scripts]
agy-python-repl = "agy_python_repl.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
