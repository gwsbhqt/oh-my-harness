[project]
name = "remote-host"
readme = "README.md"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
remote-host = "remote_host.commands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_host"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "tests", "references", "SKILL.md", "PYSKILL.md", "README.md", "README.en.md", "LICENSE", "pyproject.toml", "hatch_build.py"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"scripts/remote-host" = "remote_host/_resources/remote-host"

[tool.hatch.build.targets.sdist.force-include]
"../_shared/agentkit" = "src/remote_host/_shared/agentkit"
