[project]
name = "browser-use"
version = "3.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Control Cra and Chrome through their official MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
browser-use = "browser_use.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_use"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "tests", "references", "SKILL.md", "PYSKILL.md", "README.md", "README.en.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]
