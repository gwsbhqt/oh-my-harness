[project]
name = "computer-control"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "后台读取和操作 macOS 原生应用"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
computer-control = "computer_control.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_control"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "bin", "tests", "references", "SKILL.md", "PYSKILL.md", "README.md", "README.en.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "VENDORED.md", "pyproject.toml", "hatch_build.py"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"bin/computer-control.swift" = "computer_control/computer-control.swift"
"scripts/computer-control" = "computer_control/_launcher.py"
