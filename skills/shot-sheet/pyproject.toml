[project]
name = "shot-sheet"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Create screenshot contact sheets, comparisons, annotations, and timed media frames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "hatchling>=1.27"]

[project.scripts]
shot-sheet = "shot_sheet.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shot_sheet"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "tests", "references", "SKILL.md", "PYSKILL.md", "README.md", "README.en.md", "LICENSE", "AGENTS.md", "pyproject.toml", "hatch_build.py"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
