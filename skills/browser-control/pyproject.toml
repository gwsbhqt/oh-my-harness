[project]
name = "browser-control"
version = "2.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "后台控制明确绑定的浏览器页面"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=15,<17"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
browser-control = "browser_control.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_control"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "tests", "references", "SKILL.md", "PYSKILL.md", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py", "requirements.txt"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"scripts/browser-control" = "browser_control/_launcher.py"
