name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  UV_NO_PROGRESS: '1'

jobs:
  public-content:
    name: Public content checks (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Check documentation, licenses and public boundaries
        run: node --test tooling/test/public-repository.test.mjs

  plugins:
    name: Tooling and plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install shells for argument quoting tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh
      - name: Check tooling and every plugin
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-ci-home
          XDG_CACHE_HOME: ${{ runner.temp }}/ci-cache
          XDG_STATE_HOME: ${{ runner.temp }}/ci-state
        shell: bash
        run: |
          set -euo pipefail
          ci_failures=()
          plugin_list="$(node tooling/cli.mjs list)"
          while IFS=$'\t' read -r plugin _; do
            echo "::group::$plugin"
            if pnpm --dir "$plugin" install --frozen-lockfile; then
              if uv run --no-project --python 3.14 --with dill --with httpx pnpm --dir "$plugin" run check; then
                echo "$plugin checks passed"
              else
                ci_failures+=("$plugin:check:$?")
                echo "::error::$plugin check failed"
              fi
            else
              ci_failures+=("$plugin:install:$?")
              echo "::error::$plugin dependency installation failed; check was not run"
            fi
            echo "::endgroup::"
          done <<< "$plugin_list"
          echo "::group::tooling"
          if node --test tooling/test/*.test.mjs; then
            echo "Tooling checks passed"
          else
            ci_failures+=("tooling:$?")
            echo "::error::Tooling checks failed"
          fi
          echo "::endgroup::"
          if (( ${#ci_failures[@]} )); then
            printf 'Failed checks: %s\n' "${ci_failures[@]}"
            exit 1
          fi

  python:
    name: Python tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Test tools and shared transport
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-ci-home
          XDG_CACHE_HOME: ${{ runner.temp }}/ci-cache
          XDG_STATE_HOME: ${{ runner.temp }}/ci-state
        working-directory: skills
        shell: bash
        run: |
          set -euo pipefail
          ci_failures=()
          for component in browser-use computer-use remote-host shot-sheet _shared; do
            echo "::group::$component"
            if [[ "$component" == "_shared" ]]; then
              if uv run --no-project --python 3.12 python -m unittest discover -s _shared/tests -v; then
                echo "$component tests passed"
              else
                ci_failures+=("$component:$?")
              fi
            elif [[ "$component" == "shot-sheet" ]]; then
              if uv sync --python 3.12 --project "$component" --extra test && uv run --offline --no-sync --project "$component" python -m pytest "$component/tests" -v; then
                echo "$component tests passed"
              else
                ci_failures+=("$component:$?")
              fi
            elif [[ "$component" == "remote-host" ]]; then
              if uv run --python 3.12 --project "$component" python -m unittest discover -s "$component/tests" -v; then
                echo "$component tests passed"
              else
                ci_failures+=("$component:$?")
              fi
            else
              if uv run --python 3.12 --project "$component" --extra test python -m unittest discover -s "$component/tests" -v; then
                echo "$component tests passed"
              else
                ci_failures+=("$component:$?")
              fi
            fi
            echo "::endgroup::"
          done
          if (( ${#ci_failures[@]} )); then
            printf 'Failed test suites: %s\n' "${ci_failures[@]}"
            exit 1
          fi